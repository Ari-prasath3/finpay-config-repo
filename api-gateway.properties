server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*



#Customer route
spring.cloud.gateway.server.webflux.routes[0].id=customer
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/customers/**

#Account Route

spring.cloud.gateway.server.webflux.routes[1].id=account
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/accounts/**


#Payment Route

spring.cloud.gateway.server.webflux.routes[2].id=payment
spring.cloud.gateway.server.webflux.routes[2].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/payments/**

#Settlement Route

spring.cloud.gateway.server.webflux.routes[3].id=settlement
spring.cloud.gateway.server.webflux.routes[3].uri=lb://settlement-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/settlements/**

#Notification Route

spring.cloud.gateway.server.webflux.routes[4].id=notification
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/notifications/**

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[5].id=auth
spring.cloud.gateway.server.webflux.routes[5].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/auth/**

